<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gem Merge</title>
<style>
:root{--bg1:#1b1464;--bg2:#2a8cff;--card:#ffffff22;--yellow:#ffd23f;--green:#2ee59d;--red:#ff4d6d;--orange:#ff9f1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:12px 12px 16px;gap:10px}
.top{display:flex;gap:8px}
.pill{flex:1;background:var(--card);border-radius:16px;padding:8px 12px;backdrop-filter:blur(4px)}
.pill small{display:block;opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.pill b{font-size:22px;display:flex;align-items:center;gap:6px}
.pill svg{width:20px;height:20px}
.combo{height:26px;text-align:center;font-weight:800;color:var(--yellow);font-size:16px;transition:transform .15s}
.combo.pop{transform:scale(1.25)}
#grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:6px;min-height:0}
.cell{background:#00000033;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border:2px solid transparent;transition:border-color .1s,transform .1s}
.cell.sel{border-color:var(--yellow);transform:scale(1.06);background:#ffffff33}
.cell.merge{animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.cell svg{width:88%;height:88%;filter:drop-shadow(0 3px 3px #0006)}
.btns{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:18px;padding:14px 10px;font-weight:800;font-size:17px;color:#222;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.96)}
#spawn{flex:1;background:linear-gradient(180deg,#5dffb4,var(--green));box-shadow:0 5px 0 #11956a}
#spawn:disabled{filter:grayscale(.9) brightness(.8);box-shadow:0 5px 0 #555}
#spawn small{display:block;font-size:12px;font-weight:700;opacity:.75}
#reset{background:#ffffff33;color:#fff;font-size:13px;padding:10px;box-shadow:none}
.star{position:fixed;left:0;width:64px;height:64px;z-index:10;animation:fly 4.5s linear forwards;cursor:pointer;background:none;padding:0;box-shadow:none}
.star svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #ffd23f);animation:spin 1s linear infinite}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%) translateY(-20px);background:#000a;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;text-align:center;z-index:20;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;text-align:center;opacity:.8}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="pill"><small>Pièces</small><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd23f" stroke="#e0a100" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#e0a100" stroke-width="2"/></svg><span id="coins">0</span></b></div>
    <div class="pill"><small>Par seconde</small><b><span id="ips">0</span></b></div>
    <div class="pill"><small>Record</small><b><span id="best">1</span></b></div>
  </div>
  <div class="combo" id="combo"></div>
  <div id="grid"></div>
  <div class="hint">Touche une gemme puis une gemme identique pour les fusionner. Attrape les étoiles !</div>
  <div class="btns">
    <button id="spawn"><span>Invoquer une gemme</span><small id="cost">10</small></button>
    <button id="reset">Reset</button>
  </div>
</div>
<div id="toast"></div>
<script>
(function(){
var COLS=5,ROWS=6,N=COLS*ROWS,MAXL=16,KEY='gemmerge_v1';
var st=load();
var sel=-1;

function fresh(){return{coins:25,grid:new Array(N).fill(0),spawns:0,best:1,last:Date.now(),combo:0};}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.grid&&s.grid.length===N)return s;}catch(e){}
  return fresh();
}
function save(){try{st.last=Date.now();localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

function val(l){return 0.5*Math.pow(2,l-1);}
function income(){var t=0;for(var i=0;i<N;i++)if(st.grid[i])t+=val(st.grid[i]);return t;}
function cost(){return Math.floor(10*Math.pow(1.13,st.spawns));}
function fmt(n){
  if(n<1000)return n<10?n.toFixed(1).replace('.0',''):Math.floor(n)+'';
  var u=['K','M','B','T','Qa'],i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];
}

function gem(l){
  var h=(l*47+200)%360;
  var c1='hsl('+h+',90%,62%)',c2='hsl('+h+',90%,45%)',c3='hsl('+h+',95%,78%)';
  return '<svg viewBox="0 0 100 100"><polygon points="50,6 90,32 90,68 50,94 10,68 10,32" fill="'+c2+'" stroke="#fff" stroke-width="3"/>'+
  '<polygon points="50,6 90,32 50,50 10,32" fill="'+c3+'"/>'+
  '<polygon points="10,32 50,50 50,94 10,68" fill="'+c1+'"/>'+
  '<text x="50" y="68" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" stroke="#0006" stroke-width="1.5" paint-order="stroke">'+l+'</text></svg>';
}
function starSvg(){return '<svg viewBox="0 0 100 100"><polygon points="50,5 63,36 96,38 70,58 79,92 50,73 21,92 30,58 4,38 37,36" fill="#ffd23f" stroke="#ff9f1c" stroke-width="5" stroke-linejoin="round"/></svg>';}

var gridEl=document.getElementById('grid');
var cells=[];
for(var i=0;i<N;i++){
  (function(i){
    var d=document.createElement('div');d.className='cell';
    d.addEventListener('click',function(){tap(i);});
    gridEl.appendChild(d);cells.push(d);
  })(i);
}

function render(){
  for(var i=0;i<N;i++){
    var l=st.grid[i],c=cells[i];
    var want=l?String(l):'';
    if(c.getAttribute('data-l')!==want){c.setAttribute('data-l',want);c.innerHTML=l?gem(l):'';}
    c.classList.toggle('sel',i===sel);
  }
  document.getElementById('coins').textContent=fmt(st.coins);
  document.getElementById('ips').textContent=fmt(income());
  document.getElementById('best').textContent=st.best;
  var k=cost();
  document.getElementById('cost').textContent=fmt(k)+' pièces';
  document.getElementById('spawn').disabled=st.coins<k||st.grid.indexOf(0)<0;
  var cb=document.getElementById('combo');
  cb.textContent=st.combo>1?'Combo x'+st.combo+' !':'';
}

function tap(i){
  var g=st.grid;
  if(sel<0){if(g[i])sel=i;}
  else if(sel===i){sel=-1;}
  else if(!g[i]){g[i]=g[sel];g[sel]=0;sel=-1;}
  else if(g[i]===g[sel]&&g[i]<MAXL){
    g[i]++;g[sel]=0;sel=-1;
    if(g[i]>st.best){st.best=g[i];toast('Nouvelle gemme niveau '+g[i]+' !');}
    cells[i].classList.remove('merge');void cells[i].offsetWidth;cells[i].classList.add('merge');
    save();
  }else{sel=g[i]?i:-1;}
  render();
}

document.getElementById('spawn').addEventListener('click',function(){
  var k=cost();if(st.coins<k)return;
  var empty=[];for(var i=0;i<N;i++)if(!st.grid[i])empty.push(i);
  if(!empty.length){toast('Plus de place, fusionne tes gemmes !');return;}
  st.coins-=k;st.spawns++;
  var pos=empty[Math.floor(Math.random()*empty.length)];
  st.grid[pos]=(st.spawns>25&&Math.random()<0.2)?2:1;
  save();render();
});

document.getElementById('reset').addEventListener('click',function(){
  if(confirm('Tout recommencer à zéro ?')){st=fresh();sel=-1;save();render();}
});

var tt;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2200);}

// Étoile bonus (arcade)
function spawnStar(){
  var b=document.createElement('button');b.className='star';b.innerHTML=starSvg();
  b.style.top=(18+Math.random()*40)+'%';
  var caught=false;
  b.addEventListener('click',function(e){
    e.stopPropagation();caught=true;
    st.combo++;
    var mult=1+0.2*Math.min(st.combo-1,10);
    var gain=Math.max(20,income()*30)*mult;
    st.coins+=gain;
    toast('+'+fmt(gain)+' pièces !');
    var cb=document.getElementById('combo');cb.classList.add('pop');setTimeout(function(){cb.classList.remove('pop');},150);
    b.remove();save();render();
  });
  b.addEventListener('animationend',function(ev){
    if(ev.animationName!=='fly')return;
    if(!caught){st.combo=0;render();}
    b.remove();
  });
  document.body.appendChild(b);
  setTimeout(spawnStar,9000+Math.random()*7000);
}
setTimeout(spawnStar,5000);

// Gains hors-ligne
(function(){
  var away=Math.min((Date.now()-st.last)/1000,7200);
  if(away>30){
    var g=income()*away*0.5;
    if(g>=1){st.coins+=g;setTimeout(function(){toast('Pendant ton absence : +'+fmt(g)+' pièces');},400);}
  }
})();

// Boucle idle
var prev=Date.now();
setInterval(function(){
  var n=Date.now(),dt=(n-prev)/1000;prev=n;
  st.coins+=income()*dt;
  render();
},200);
setInterval(save,3000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});

render();
})();
</script>
</body>
</html>
