<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Saveurs et Villas</title>
<style>
:root{--cream:#fff4e0;--ink:#3a2a2a;--gold:#ffd23f;--green:#2ee59d;--coral:#ff6b6b;--teal:#2a9d8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
body{background:linear-gradient(170deg,#2a1f3d,#7a2f5c 60%,#c0504d);display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:10px 10px 8px;gap:8px}
.bar{display:flex;gap:6px}
.pill{flex:1;background:#ffffff26;border-radius:14px;padding:6px 10px;min-width:0}
.pill small{display:block;opacity:.8;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.pill b{font-size:18px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hidden{display:none!important}
#orders{display:flex;gap:6px}
.order{flex:1;min-width:0;background:var(--cream);color:var(--ink);border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;border:3px solid transparent;cursor:pointer}
.order.ok{border-color:var(--green);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.order .top{display:flex;align-items:center;gap:4px;width:100%}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.order .nm{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rq{display:flex;gap:2px;justify-content:center}
.rq svg{width:34px;height:34px}
.rw{font-size:11px;font-weight:800;color:#b07a00}
#grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;min-height:0}
.cell{background:#00000033;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;cursor:pointer;min-width:0;min-height:0}
.cell.sel{border-color:var(--gold);background:#ffffff33;transform:scale(1.05)}
.cell.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.cell svg{width:94%;height:94%;filter:drop-shadow(0 2px 2px #0006)}
#info{min-height:34px;font-size:13px;text-align:center;opacity:.95;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:16px;padding:12px 10px;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer}
button:active{transform:scale(.96)}
button:disabled{filter:grayscale(.9) brightness(.8)}
#ad{flex:1;background:linear-gradient(180deg,#ffe36e,var(--gold));box-shadow:0 4px 0 #c79a00}
.nav{display:flex;gap:8px}
.nav button{flex:1;background:#ffffff26;color:#fff;box-shadow:none}
.nav button.on{background:var(--cream);color:var(--ink)}
#scene{background:#000;border-radius:16px;overflow:hidden}
#scene svg{display:block;width:100%;height:auto}
.card{background:var(--cream);color:var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:16px}
.card p{margin:0;font-size:13px;opacity:.8}
.prog{height:10px;background:#0002;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--coral))}
#renov{background:linear-gradient(180deg,#5dffb4,var(--green));box-shadow:0 4px 0 #11956a}
#reset{background:none;color:#fff;opacity:.6;font-size:12px;padding:6px;box-shadow:none}
#dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
#dlg .box{width:100%;max-width:480px;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
#dlg .who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
#dlg .av{width:42px;height:42px;font-size:20px}
#dtxt{font-size:16px;line-height:1.4;min-height:66px}
#dnext{background:linear-gradient(180deg,#ff9a8b,var(--coral));color:#fff;box-shadow:0 4px 0 #b53a3a}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-20px);background:#000b;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;text-align:center;z-index:60;max-width:90%;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="pill"><small>Énergie</small><b><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="#ffd23f" stroke="#e0a100" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="en">30/30</span></b></div>
    <div class="pill"><small>Pièces</small><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd23f" stroke="#e0a100" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#e0a100" stroke-width="2"/></svg><span id="coins">0</span></b></div>
    <div class="pill"><small>Réputation</small><b><svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21.5 12,17.5 5.5,21.5 7.5,14 2,9.5 9,9" fill="#ff9f1c" stroke="#c76f00" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="stars">0</span></b></div>
  </div>

  <div id="s-cuisine" class="screen">
    <div id="orders"></div>
    <div id="grid"></div>
    <div id="info"></div>
    <div class="row"><button id="ad">Pub : +10 énergie</button></div>
  </div>

  <div id="s-domaine" class="screen hidden">
    <div id="scene"></div>
    <div class="card" id="upcard"></div>
    <button id="reset">Recommencer la partie</button>
  </div>

  <div class="nav">
    <button id="t-cuisine" class="on">Cuisine</button>
    <button id="t-domaine">Domaine</button>
  </div>
</div>

<div id="dlg" class="hidden"><div class="box">
  <div class="who"><span class="av" id="dav"></span><span id="dname"></span></div>
  <div id="dtxt"></div>
  <button id="dnext">Suivant</button>
</div></div>
<div id="toast"></div>

<script>
(function(){
var N=36,MAXL=6,KEY='saveurs_villas_v1',EMAX=30,ERT=30000;

var CH={
  pot:{name:"Potager",col:"#3aa860",items:["Graine","Pousse","Tomate","Cagette","Panier garni","Récolte d'or"]},
  four:{name:"Fournil",col:"#e08a2e",items:["Farine","Pâte","Petit pain","Baguette","Fournée","Pain doré"]},
  deco:{name:"Atelier",col:"#3d8fd9",items:["Clou","Planche","Chaise","Table","Buffet","Lustre"]}
};
var CHK=["pot","four","deco"];
var WHO={
  chloe:{n:"Chloé",col:"#ff6b6b"},
  marco:{n:"Marco",col:"#2a9d8f"},
  val:{n:"Mme Valmont",col:"#8e44ad"},
  leo:{n:"Léo",col:"#e76f51"}
};
var REW=[0,0,20,45,95,200,400];

var ICONS={
pot:[
'<ellipse cx="50" cy="60" rx="16" ry="10" fill="#8b5a2b"/><ellipse cx="46" cy="57" rx="5" ry="3" fill="#b07a45"/>',
'<path d="M50 78V48" stroke="#2e9e4f" stroke-width="6" stroke-linecap="round"/><ellipse cx="38" cy="46" rx="14" ry="8" fill="#4cd07a" transform="rotate(-25 38 46)"/><ellipse cx="62" cy="40" rx="14" ry="8" fill="#4cd07a" transform="rotate(25 62 40)"/><ellipse cx="50" cy="82" rx="16" ry="5" fill="#8b5a2b"/>',
'<circle cx="50" cy="58" r="28" fill="#e63946"/><ellipse cx="42" cy="48" rx="7" ry="4" fill="#ff8a93" transform="rotate(-30 42 48)"/><path d="M50 30l-8 8h16z" fill="#2e9e4f" stroke="#2e9e4f" stroke-width="4" stroke-linejoin="round"/>',
'<rect x="12" y="52" width="76" height="34" rx="5" fill="#a9713c"/><path d="M12 66h76M12 78h76" stroke="#7a4e24" stroke-width="3"/><circle cx="32" cy="46" r="15" fill="#e63946"/><circle cx="56" cy="44" r="15" fill="#e63946"/><circle cx="74" cy="50" r="11" fill="#f4a261"/>',
'<path d="M16 50h68l-8 36H24z" fill="#c68a4a"/><path d="M30 50c0-34 40-34 40 0" fill="none" stroke="#8b5a2b" stroke-width="5"/><circle cx="34" cy="46" r="13" fill="#e63946"/><circle cx="58" cy="42" r="13" fill="#4cd07a"/><circle cx="72" cy="48" r="10" fill="#f4a261"/><path d="M24 62h52M28 74h44" stroke="#a9713c" stroke-width="3"/>',
'<circle cx="50" cy="55" r="36" fill="#ffd23f" opacity=".35"/><circle cx="50" cy="58" r="26" fill="#ffc300" stroke="#e09f00" stroke-width="3"/><ellipse cx="42" cy="49" rx="7" ry="4" fill="#fff3b0" transform="rotate(-30 42 49)"/><path d="M50 32l-8 8h16z" fill="#2e9e4f" stroke="#2e9e4f" stroke-width="4" stroke-linejoin="round"/><path d="M82 20l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>'
],
four:[
'<path d="M26 34h48l8 52H18z" fill="#f1e2c4" stroke="#c9b27c" stroke-width="3"/><path d="M30 34l6-12h28l6 12" fill="#e6d3a8"/><rect x="34" y="54" width="32" height="18" rx="4" fill="#fff" opacity=".7"/>',
'<ellipse cx="50" cy="62" rx="34" ry="22" fill="#f8ead0" stroke="#e0c9a0" stroke-width="3"/><ellipse cx="40" cy="54" rx="10" ry="5" fill="#fff" opacity=".6"/>',
'<ellipse cx="50" cy="60" rx="34" ry="24" fill="#d98a3d"/><path d="M34 48l10 22M50 44l10 26M64 50l8 18" stroke="#a65f1f" stroke-width="4" stroke-linecap="round"/><ellipse cx="40" cy="50" rx="10" ry="4" fill="#f0b46e" opacity=".7"/>',
'<g transform="rotate(-35 50 50)"><rect x="6" y="36" width="88" height="28" rx="14" fill="#d98a3d"/><path d="M26 40l6 20M44 40l6 20M62 40l6 20" stroke="#a65f1f" stroke-width="4" stroke-linecap="round"/></g>',
'<rect x="10" y="62" width="80" height="14" rx="6" fill="#9aa5b1"/><ellipse cx="30" cy="54" rx="16" ry="12" fill="#d98a3d"/><ellipse cx="52" cy="50" rx="16" ry="12" fill="#e29a4d"/><ellipse cx="72" cy="54" rx="14" ry="11" fill="#d98a3d"/><path d="M24 48l4 12M46 44l4 12M68 48l4 10" stroke="#a65f1f" stroke-width="3" stroke-linecap="round"/>',
'<circle cx="50" cy="56" r="36" fill="#ffd23f" opacity=".35"/><ellipse cx="50" cy="60" rx="34" ry="24" fill="#ffc300" stroke="#e09f00" stroke-width="3"/><path d="M34 48l10 22M50 44l10 26M64 50l8 18" stroke="#e09f00" stroke-width="4" stroke-linecap="round"/><path d="M82 18l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>'
],
deco:[
'<rect x="46" y="22" width="8" height="52" rx="3" fill="#9aa5b1"/><rect x="34" y="16" width="32" height="9" rx="4" fill="#c3ccd6"/><path d="M46 74l4 12 4-12z" fill="#9aa5b1"/>',
'<rect x="10" y="38" width="80" height="26" rx="4" fill="#c68a4a"/><path d="M18 46h30M52 54h30M18 58h20" stroke="#a9713c" stroke-width="3" stroke-linecap="round"/><circle cx="72" cy="46" r="4" fill="#a9713c"/>',
'<rect x="28" y="12" width="28" height="36" rx="5" fill="#c68a4a"/><rect x="26" y="48" width="48" height="10" rx="4" fill="#a9713c"/><path d="M30 58v28M70 58v28" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/>',
'<rect x="10" y="34" width="80" height="12" rx="5" fill="#c68a4a"/><path d="M20 46v40M80 46v40" stroke="#8b5a2b" stroke-width="8" stroke-linecap="round"/><ellipse cx="50" cy="28" rx="16" ry="6" fill="#fff"/>',
'<rect x="16" y="14" width="68" height="72" rx="5" fill="#a9713c"/><rect x="22" y="20" width="26" height="60" rx="3" fill="#c68a4a"/><rect x="52" y="20" width="26" height="60" rx="3" fill="#c68a4a"/><circle cx="43" cy="50" r="3" fill="#ffd23f"/><circle cx="57" cy="50" r="3" fill="#ffd23f"/>',
'<path d="M50 8v22" stroke="#e09f00" stroke-width="4"/><path d="M18 56c0-22 64-22 64 0" fill="none" stroke="#ffc300" stroke-width="6" stroke-linecap="round"/><path d="M50 30v26" stroke="#ffc300" stroke-width="6"/><path d="M18 56v8M50 56v14M82 56v8" stroke="#ffc300" stroke-width="5"/><circle cx="18" cy="70" r="7" fill="#fff3b0"/><circle cx="50" cy="76" r="8" fill="#fff3b0"/><circle cx="82" cy="70" r="7" fill="#fff3b0"/><circle cx="50" cy="76" r="14" fill="#ffd23f" opacity=".3"/>'
]};

function ico(c,l,badge){
  return '<svg viewBox="0 0 100 100">'+ICONS[c][l-1]+
    (badge?'<circle cx="84" cy="16" r="11" fill="#2b1d3a" opacity=".85"/><text x="84" y="21" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">'+l+'</text>':'')+'</svg>';
}
function genIco(c){
  var col=CH[c].col;
  return '<svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="18" fill="'+col+'" stroke="#fff" stroke-width="3"/>'+
    '<g transform="translate(16 12) scale(.68)">'+ICONS[c][2]+'</g>'+
    '<circle cx="76" cy="76" r="15" fill="#fff"/><path d="M76 67v18M67 76h18" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/></svg>';
}

var UP=[
 {n:"Nettoyer la façade du bistrot",cost:60},
 {n:"Poser la nouvelle enseigne",cost:150},
 {n:"Réparer la terrasse",cost:300},
 {n:"Rénover la salle du restaurant",cost:600},
 {n:"Rouvrir la cuisine",cost:1000},
 {n:"Restaurer le hall du manoir",cost:1600},
 {n:"Redonner vie au jardin",cost:2500},
 {n:"Aménager le salon de réception",cost:4000},
 {n:"Créer la suite de la villa",cost:6000},
 {n:"Organiser la grande réouverture",cost:9000}
];

var STORY={
 intro:[
  ["chloe","Ma grand-mère m'a laissé un vieux bistrot, et le manoir qui le surplombe. Tout est en ruine."],
  ["marco","Bienvenue, Chloé. Moi, c'est Marco, l'ancien chef. Ce bistrot a connu de belles heures. Ça te dit de les revivre ?"],
  ["chloe","Je ne sais pas cuisiner, mais je veux essayer ! Par où commencer ?"],
  ["marco","Touche un générateur pour obtenir des ingrédients, puis fusionne deux objets identiques. Livre les commandes et gagne des pièces pour rénover."],
  ["val","Un bistrot délabré à côté de mon domaine ? Quel spectacle navrant. Je vous le rachète quand vous voulez."],
  ["chloe","Jamais ! Ce bistrot n'est pas à vendre."]
 ],
 1:[["marco","Voilà, la façade est propre ! On voit enfin la couleur des murs."],["chloe","Mamie disait que ces murs jaunes portaient chance."]],
 2:[["leo","Bonjour ! Léo, journaliste gourmand. Une nouvelle enseigne ? Je vais écrire un article sur la réouverture."],["val","Une enseigne... charmant. Cela ne durera pas."]],
 3:[["marco","La terrasse est réparée. Les premiers clients pourront s'installer au soleil."],["chloe","J'ai trouvé un carnet de recettes caché sous une latte du plancher !"]],
 4:[["marco","Ce carnet... c'est l'écriture de ta grand-mère ! Une recette de famille s'y cache."],["leo","Une recette secrète ? Voilà un bel article en perspective."]],
 5:[["marco","La cuisine est rouverte ! Sens-tu cette odeur de pain chaud ?"],["chloe","La dernière page du carnet parle du manoir. Mamie y cachait quelque chose."]],
 6:[["val","Vous osez toucher au hall du manoir ? Ce domaine appartenait à ma famille avant votre grand-mère."],["chloe","Elle l'a acheté honnêtement, madame. Je compte bien le prouver."]],
 7:[["leo","Le jardin est magnifique ! Au fait, j'ai trouvé un vieil acte de vente dans les archives..."],["chloe","Montre-moi ça, Léo !"]],
 8:[["marco","Le salon de réception brille de mille feux. Tu as le talent de ta grand-mère."],["val","Je... ce salon était celui de mon enfance. Je reconnais cette cheminée."]],
 9:[["val","L'acte est authentique. Votre grand-mère et ma mère étaient amies, bien avant ce malentendu."],["chloe","Alors ce manoir peut redevenir un lieu pour tout le monde."]],
 10:[["marco","C'est le grand soir ! Tout le quartier est là."],["val","Je m'incline. Faisons de ce domaine une table d'exception, ensemble."],["leo","Titre de demain : le bistrot des Lilas renaît de ses cendres !"],["chloe","Merci à tous. Mais ce n'est que le début..."]]
};

function rnd(n){return Math.floor(Math.random()*n);}

function newOrder(up){
  var maxL=Math.min(5,2+Math.floor(up/2));
  var nreq=(up>=2&&Math.random()<0.5)?2:1;
  var req=[],tries=0;
  while(req.length<nreq&&tries<50){
    tries++;
    var c=CHK[rnd(3)],l=2+rnd(maxL-1);
    if(!req.some(function(r){return r.c===c&&r.l===l;}))req.push({c:c,l:l});
  }
  var coins=0;req.forEach(function(r){coins+=REW[r.l];});
  var w=["marco","leo","val"];
  return{who:w[rnd(3)],req:req,coins:coins};
}

function fresh(){
  var g=[];for(var i=0;i<N;i++)g.push(null);
  g[0]={g:"pot"};g[1]={g:"four"};g[2]={g:"deco"};
  [[8,"pot"],[9,"pot"],[10,"four"],[11,"four"],[14,"deco"],[15,"deco"]].forEach(function(a){g[a[0]]={c:a[1],l:1};});
  var o=[newOrder(0),newOrder(0),newOrder(0)];
  return{e:EMAX,et:Date.now(),coins:30,stars:0,up:0,seen:false,grid:g,orders:o,adT:0};
}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.grid&&s.grid.length===N&&s.orders)return s;}catch(e){}
  return fresh();
}
var st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

function fmt(n){
  n=Math.floor(n);
  if(n<10000)return String(n);
  if(n<1e6)return (n/1000).toFixed(1).replace(".0","")+"K";
  return (n/1e6).toFixed(1).replace(".0","")+"M";
}
function $(id){return document.getElementById(id);}

var tt;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2200);}

function regen(){
  var n=Date.now();
  if(st.e>=EMAX){st.et=n;return;}
  var g=Math.floor((n-st.et)/ERT);
  if(g>0){st.e=Math.min(EMAX,st.e+g);st.et+=g*ERT;if(st.e>=EMAX)st.et=n;}
}

// Plateau
var sel=-1;
var gridEl=$("grid"),cells=[];
for(var i=0;i<N;i++){
  (function(i){
    var d=document.createElement("div");d.className="cell";
    d.addEventListener("click",function(){tap(i);});
    gridEl.appendChild(d);cells.push(d);
  })(i);
}

function cellKey(x){return !x?"":(x.g?"g"+x.g:x.c+x.l);}

function renderGrid(){
  for(var i=0;i<N;i++){
    var x=st.grid[i],c=cells[i],k=cellKey(x);
    if(c.getAttribute("data-k")!==k){
      c.setAttribute("data-k",k);
      c.innerHTML=!x?"":(x.g?genIco(x.g):ico(x.c,x.l,true));
    }
    c.classList.toggle("sel",i===sel);
  }
}

function count(c,l){var n=0;st.grid.forEach(function(x){if(x&&x.c===c&&x.l===l)n++;});return n;}
function canDeliver(o){return o.req.every(function(r){return count(r.c,r.l)>=1;});}

function renderOrders(){
  var h="";
  st.orders.forEach(function(o,i){
    var w=WHO[o.who];
    h+='<div class="order'+(canDeliver(o)?' ok':'')+'" data-i="'+i+'"><div class="top"><span class="av" style="background:'+w.col+'">'+w.n.charAt(0)+'</span><span class="nm">'+w.n+'</span></div><div class="rq">'+
      o.req.map(function(r){return ico(r.c,r.l,true);}).join("")+'</div><div class="rw">+'+o.coins+' pièces</div></div>';
  });
  $("orders").innerHTML=h;
}
$("orders").addEventListener("click",function(e){
  var el=e.target.closest(".order");if(!el)return;
  var o=st.orders[+el.getAttribute("data-i")];
  if(!canDeliver(o)){
    var miss=o.req.filter(function(r){return count(r.c,r.l)<1;}).map(function(r){return CH[r.c].items[r.l-1];});
    toast("Il te manque : "+miss.join(", "));return;
  }
  o.req.forEach(function(r){
    for(var i=0;i<N;i++){var x=st.grid[i];if(x&&x.c===r.c&&x.l===r.l){st.grid[i]=null;break;}}
  });
  st.coins+=o.coins;st.stars+=o.req.length;
  st.orders[+el.getAttribute("data-i")]=newOrder(st.up);
  sel=-1;toast("Commande livrée : +"+o.coins+" pièces");
  save();render();
});

function setInfo(m){$("info").textContent=m;}

function tap(i){
  var g=st.grid,x=g[i];
  if(x&&x.g){
    if(st.e<1){toast("Plus d'énergie ! Attends ou regarde une pub.");return;}
    var empty=[];for(var k=0;k<N;k++)if(!g[k])empty.push(k);
    if(!empty.length){toast("Plateau plein : fusionne tes objets !");return;}
    if(st.e>=EMAX)st.et=Date.now();
    st.e--;
    var pos=empty[rnd(empty.length)];
    g[pos]={c:x.g,l:Math.random()<0.12?2:1};
    cells[pos].classList.remove("pop");void cells[pos].offsetWidth;cells[pos].classList.add("pop");
    sel=-1;save();render();return;
  }
  if(sel<0){
    if(x){sel=i;setInfo(CH[x.c].items[x.l-1]+" (niveau "+x.l+")");}
  }else if(sel===i){sel=-1;setInfo("");}
  else if(!x){g[i]=g[sel];g[sel]=null;sel=-1;setInfo("");}
  else if(x.c===g[sel].c&&x.l===g[sel].l){
    if(x.l>=MAXL){toast("Niveau maximum !");sel=-1;}
    else{
      g[i]={c:x.c,l:x.l+1};g[sel]=null;sel=-1;
      setInfo(CH[x.c].items[x.l]+" (niveau "+(x.l+1)+")");
      cells[i].classList.remove("pop");void cells[i].offsetWidth;cells[i].classList.add("pop");
      save();
    }
  }else{sel=i;setInfo(CH[x.c].items[x.l-1]+" (niveau "+x.l+")");}
  render();
}

$("ad").addEventListener("click",function(){
  var n=Date.now();
  if(n<st.adT){toast("Prochaine pub dans "+Math.ceil((st.adT-n)/1000)+" s");return;}
  st.adT=n+20000;st.e+=10;
  toast("Pub simulée : +10 énergie (la vraie pub viendra plus tard)");
  save();render();
});

// Domaine
function scene(u){
  var night=u>=10;
  var wall=u<1?"#9a8f86":"#f6c667",roof=u<1?"#6b5b53":"#c0392b";
  var mw=u<6?"#8f877d":"#e9dcc3",mr=u<6?"#5b5560":"#4a5a8a";
  var s='<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect width="400" height="250" fill="'+(night?"#23244f":"#8ed1f5")+'"/>';
  if(night){for(var q=0;q<16;q++)s+='<circle cx="'+((q*53+17)%400)+'" cy="'+((q*31+9)%90)+'" r="1.6" fill="#fff"/>';}
  else s+='<circle cx="350" cy="36" r="18" fill="#fff6a8"/>';
  s+='<rect y="200" width="400" height="50" fill="'+(u>=7?"#4caf50":"#8a9a5b")+'"/>';
  // manoir
  s+='<rect x="210" y="90" width="170" height="110" fill="'+mw+'"/>';
  s+='<polygon points="200,92 295,40 390,92" fill="'+mr+'"/>';
  var lit=u>=8?"#ffe08a":"#5a6275";
  s+='<rect x="226" y="112" width="30" height="34" rx="3" fill="'+lit+'"/><rect x="334" y="112" width="30" height="34" rx="3" fill="'+lit+'"/>';
  s+='<rect x="226" y="160" width="30" height="30" rx="3" fill="'+lit+'"/><rect x="334" y="160" width="30" height="30" rx="3" fill="'+lit+'"/>';
  s+='<circle cx="295" cy="84" r="12" fill="'+(u>=9?"#ffe08a":"#5a6275")+'"/>';
  s+='<rect x="280" y="150" width="30" height="50" rx="4" fill="'+(u>=6?"#7b2d26":"#4a3a35")+'"/>';
  if(u>=6){for(var c=0;c<4;c++)s+='<rect x="'+(262+c*22)+'" y="146" width="6" height="54" fill="#fff"/>';}
  if(u>=9)s+='<rect x="262" y="132" width="66" height="6" fill="#333"/><path d="M266 132v-10M280 132v-10M294 132v-10M308 132v-10M322 132v-10" stroke="#333" stroke-width="2"/>';
  if(u<6)s+='<path d="M230 112l26 34M350 118l-14 24M300 150l10 24" stroke="#3a3a3a" stroke-width="2"/>';
  if(u>=7){
    [220,250,330,365,392].forEach(function(x,i){s+='<circle cx="'+x+'" cy="200" r="'+(i%2?12:16)+'" fill="#2e8b3e"/>';});
    [226,254,334,362].forEach(function(x,i){s+='<circle cx="'+x+'" cy="'+(196-(i%2)*6)+'" r="3.5" fill="'+(i%2?"#ff6b9d":"#ffd23f")+'"/>';});
  }
  // bistrot
  s+='<rect x="20" y="120" width="150" height="80" fill="'+wall+'"/>';
  s+='<polygon points="10,122 95,80 180,122" fill="'+roof+'"/>';
  var wl=u>=4?"#ffe08a":"#556";
  s+='<rect x="35" y="140" width="36" height="28" rx="3" fill="'+wl+'"/><rect x="119" y="140" width="36" height="28" rx="3" fill="'+wl+'"/>';
  s+='<rect x="83" y="160" width="24" height="40" rx="3" fill="#7b4a2a"/>';
  if(u<1)s+='<path d="M35 140l36 28M71 140l-36 28M119 150h36M30 125l14 30" stroke="#3a3a3a" stroke-width="2.5"/>';
  if(u>=2)s+='<rect x="58" y="100" width="74" height="16" rx="4" fill="#2b1d3a"/><text x="95" y="112" text-anchor="middle" font-size="11" font-weight="800" fill="#ffd23f" font-family="sans-serif">LES LILAS</text>';
  if(u>=3){
    s+='<rect x="24" y="206" width="30" height="5" fill="#8b5a2b"/><rect x="132" y="206" width="30" height="5" fill="#8b5a2b"/>';
    s+='<path d="M20 194h38l-19-14z" fill="#ff6b6b"/><path d="M128 194h38l-19-14z" fill="#ffd23f"/>';
  }
  if(u>=5){s+='<rect x="140" y="92" width="14" height="30" fill="#7b4a2a"/><circle cx="147" cy="82" r="7" fill="#fff" opacity=".7"/><circle cx="154" cy="68" r="9" fill="#fff" opacity=".5"/>';}
  if(night){
    s+='<path d="M20 30l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffd23f"/><path d="M370 20l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ff6b9d"/><path d="M200 24l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#2ee59d"/>';
    s+='<rect x="70" y="52" width="120" height="18" rx="5" fill="#ffd23f"/><text x="130" y="65" text-anchor="middle" font-size="11" font-weight="800" fill="#2b1d3a" font-family="sans-serif">Grande réouverture</text>';
  }
  return s+'</svg>';
}

function renderDomain(){
  $("scene").innerHTML=scene(st.up);
  var h;
  if(st.up>=UP.length){
    h='<h3>Chapitre 1 terminé</h3><p>Le domaine est entièrement rénové. La suite de l\'histoire arrive bientôt !</p>';
  }else{
    var u=UP[st.up];
    h='<h3>'+(st.up+1)+'/'+UP.length+' · '+u.n+'</h3><div class="prog"><i style="width:'+Math.min(100,st.coins/u.cost*100)+'%"></i></div><p>Coût : '+u.cost+' pièces (tu as '+fmt(st.coins)+')</p><button id="renov"'+(st.coins<u.cost?' disabled':'')+'>Rénover</button>';
  }
  $("upcard").innerHTML=h;
  var b=$("renov");
  if(b)b.addEventListener("click",function(){
    var u=UP[st.up];if(st.coins<u.cost)return;
    st.coins-=u.cost;st.up++;save();render();
    dialog(STORY[st.up]||[]);
  });
}

$("reset").addEventListener("click",function(){
  if(confirm("Tout recommencer à zéro ?")){st=fresh();sel=-1;save();setInfo("");render();dialog(STORY.intro,function(){st.seen=true;save();});}
});

// Dialogues
var dq=[],dcb=null;
function dialog(lines,cb){
  if(!lines||!lines.length){if(cb)cb();return;}
  dq=lines.slice();dcb=cb||null;$("dlg").classList.remove("hidden");nextLine();
}
function nextLine(){
  if(!dq.length){$("dlg").classList.add("hidden");var f=dcb;dcb=null;if(f)f();return;}
  var l=dq.shift(),w=WHO[l[0]];
  $("dav").style.background=w.col;$("dav").textContent=w.n.charAt(0);
  $("dname").textContent=w.n;$("dtxt").textContent=l[1];
  $("dnext").textContent=dq.length?"Suivant":"Continuer";
}
$("dnext").addEventListener("click",nextLine);

// Onglets
function tab(t){
  $("s-cuisine").classList.toggle("hidden",t!=="cuisine");
  $("s-domaine").classList.toggle("hidden",t!=="domaine");
  $("t-cuisine").classList.toggle("on",t==="cuisine");
  $("t-domaine").classList.toggle("on",t==="domaine");
  if(t==="domaine")renderDomain();
}
$("t-cuisine").addEventListener("click",function(){tab("cuisine");});
$("t-domaine").addEventListener("click",function(){tab("domaine");});

function renderBar(){
  regen();
  var t="";
  if(st.e<EMAX){var s=Math.ceil((ERT-(Date.now()-st.et))/1000);t=" ("+s+"s)";}
  $("en").textContent=st.e+"/"+EMAX+t;
  $("coins").textContent=fmt(st.coins);
  $("stars").textContent=st.stars;
}
function render(){
  renderBar();renderGrid();renderOrders();
  if(!$("s-domaine").classList.contains("hidden"))renderDomain();
}

setInterval(renderBar,1000);
setInterval(save,5000);
document.addEventListener("visibilitychange",function(){if(document.hidden)save();});

render();
if(!st.seen){dialog(STORY.intro,function(){st.seen=true;save();});}
})();
</script>
</body>
